spring.application.name=demo

# Setting up application configuration.
# application.properties is a non-Java configuration file
# that stores values in key=value format.

#paymentGateway.type=paytm
#paymentGateway.retry-count=5

# Configuration values for the PaymentProperties class.
# The prefix "payment-property" must match the value
# used in @ConfigurationProperties.
payment-property.type=paytm
payment-property.retry-count=5
payment-property.enabled=true
payment-property.timeout=3000