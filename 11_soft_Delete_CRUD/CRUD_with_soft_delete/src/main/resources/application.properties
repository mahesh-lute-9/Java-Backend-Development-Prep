# Name of the Spring Boot application.
# Spring uses this value as the application name in its context/configuration.
spring.application.name=crudSpringBootDemo


# ==============================
# Database Configuration
# ==============================

# JDBC URL used by Spring Boot to connect to the PostgreSQL database.
# Format: jdbc:postgresql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:postgresql://localhost:5432/student_crud_db

# PostgreSQL database username.
spring.datasource.username=postgres

# PostgreSQL database password.
spring.datasource.password=postgres123


# ==============================
# JPA / Hibernate Configuration
# ==============================

# Controls how Hibernate manages database tables based on our @Entity classes.
#
# update -> creates missing tables/columns and updates the schema without
#           intentionally dropping existing data.
#
# Other commonly used values:
# create -> creates the schema on startup (existing schema may be dropped)
# create-drop -> creates on startup and drops it when the application stops
# validate -> only validates the existing schema; does not modify it
# none -> no automatic schema management
spring.jpa.hibernate.ddl-auto=update


# Displays the SQL queries generated by Hibernate in the application console.
# Useful during development/debugging.
spring.jpa.show-sql=true


# Formats Hibernate-generated SQL queries to make them easier to read.
spring.jpa.properties.hibernate.format_sql=true